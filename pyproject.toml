[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-guardrails-plugin"
version = "0.1.0"
description = "Guardrails cockpit plugin for Hermes Agent"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
  "pyyaml",
]

[tool.hatch.build.targets.wheel]
packages = ["hermes_guardrails"]
